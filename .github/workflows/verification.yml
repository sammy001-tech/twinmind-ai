name: Verification

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Unit tests, typecheck, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: TypeScript verification
        run: npm run lint

      - name: Production build
        run: npm run build
