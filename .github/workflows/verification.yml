name: Verification

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main
      - "fix/**"

permissions:
  contents: read

jobs:
  verify:
    name: Unit tests, typecheck, production build, and Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: TypeScript verification
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Build Docker image
        run: docker build --pull --tag twinmind-ai:verification .

      - name: Smoke-test the container health endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          container_id="$(docker run --detach --publish 127.0.0.1:10000:10000 --env PORT=10000 twinmind-ai:verification)"
          cleanup() {
            docker stop "$container_id" >/dev/null 2>&1 || true
            docker rm "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if response="$(curl --silent --show-error --fail --max-time 2 http://127.0.0.1:10000/api/health 2>/dev/null)"; then
              if node -e 'const health = JSON.parse(process.argv[1]); process.exit(health.status === "ok" ? 0 : 1)' "$response"; then
                printf '%s\n' "$response"
                exit 0
              fi
            fi

            if [ "$(docker inspect --format='{{.State.Running}}' "$container_id")" != "true" ]; then
              docker logs "$container_id" >&2 || true
              exit 1
            fi
            sleep 2
          done

          docker logs "$container_id" >&2 || true
          echo "Docker container did not become healthy within 60 seconds." >&2
          exit 1
